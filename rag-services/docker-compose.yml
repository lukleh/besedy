# Model serving for the ColBERT sidecar.
# Shared across dev/test/prod — independent of the web stack.
#
# Usage:
#   just colbert-up    (or: bash scripts/run_rag_services_compose.sh up -d)
#   bash scripts/run_rag_services_compose.sh --profile colbert-indexer run --rm --no-deps colbert-indexer build-index
#
# Use the wrapper rather than raw `docker compose`: it passes the host env file
# that holds COLBERT_PRELOAD_INDEX_DIR (template: rag-services/.env.example).
#
# Endpoints:
#   ColBERT:    http://127.0.0.1:8192 from the host (loopback only)
#               http://besedy-colbert:8192 from containers on besedy-internal
#
# Containers cannot reach host ports (docs/web/egress-isolation.md), so web
# reaches ColBERT over the shared besedy-internal network. Searching from
# outside Besedy goes through the MCP server, which applies catalog ACLs.
#
# Models are cached in named volumes so they survive container restarts.

name: besedy-rag-services

services:
  colbert:
    # Built from this checkout only: never pull this tag from a registry (Compose's
    # default tries a pull before building a missing image).
    image: "${COLBERT_IMAGE:-besedy/colbert:local}"
    pull_policy: never
    build:
      context: ..
      dockerfile: rag-services/colbert/Dockerfile
    container_name: besedy-colbert
    ports:
      - "${COLBERT_HOST_BIND:-127.0.0.1}:${COLBERT_HOST_PORT:-8192}:8192"
    networks:
      - default
      - besedy_internal
    working_dir: /workspace/besedy
    command:
      - python
      - -m
      - besedy.lib.rag_colbert_runtime.server
      - --host
      - 0.0.0.0
      - --port
      - "8192"
    volumes:
      - ..:/workspace/besedy:rw
      - ${BESEDY_CONFIG_FILE:-${HOME}/.config/lukleh/besedy/besedy.toml}:/data/config/besedy.toml:ro
      - ${RAG_COLBERT_HOST_DIR:-${BESEDY_STATE_HOME:-${HOME}/.local/state/lukleh/besedy}/tmp/rag_colbert}:/data/state/rag_colbert:rw
      - colbert_model_cache:/data/hf
      - colbert_torch_cache:/data/torch
    environment:
      BESEDY_CONFIG: /data/config/besedy.toml
      # The checkout is bind-mounted and the container runs as root; do not
      # leave root-owned __pycache__ directories in it.
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: /data/hf
      HF_HUB_CACHE: /data/hf/hub
      TRANSFORMERS_CACHE: /data/hf/transformers
      TORCH_HOME: /data/torch
      COLBERT_PRELOAD_INDEX_DIR: ${COLBERT_PRELOAD_INDEX_DIR:-}
      CUDA_VISIBLE_DEVICES: ""
      NVIDIA_VISIBLE_DEVICES: void
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8192/health"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 120s

  colbert-indexer:
    image: "${COLBERT_IMAGE:-besedy/colbert:local}"
    pull_policy: never
    build:
      context: ..
      dockerfile: rag-services/colbert/Dockerfile
    profiles: ["colbert-indexer"]
    working_dir: /workspace/besedy
    entrypoint:
      - bash
      - /workspace/besedy/rag-services/colbert/run_worker.sh
    gpus: all
    volumes:
      - ..:/workspace/besedy:rw
      - ${BESEDY_CONFIG_FILE:-${HOME}/.config/lukleh/besedy/besedy.toml}:/data/config/besedy.toml:ro
      - ${RAG_COLBERT_HOST_DIR:-${BESEDY_STATE_HOME:-${HOME}/.local/state/lukleh/besedy}/tmp/rag_colbert}:/data/state/rag_colbert:rw
      - colbert_model_cache:/data/hf
      - colbert_torch_cache:/data/torch
    environment:
      BESEDY_CONFIG: /data/config/besedy.toml
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: /data/hf
      HF_HUB_CACHE: /data/hf/hub
      TRANSFORMERS_CACHE: /data/hf/transformers
      TORCH_HOME: /data/torch
      TORCH_EXTENSIONS_DIR: /data/torch/extensions
      TMPDIR: ${TMPDIR:-/tmp}
      TMP: ${TMPDIR:-/tmp}
      TEMP: ${TMPDIR:-/tmp}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}

networks:
  default:
    enable_ipv6: false
    driver_opts:
      # The host egress policy covers every br-bsdy* bridge
      # (docs/web/egress-isolation.md).
      com.docker.network.bridge.name: br-bsdy-rag
  besedy_internal:
    name: ${BESEDY_INTERNAL_NETWORK:-besedy-internal}
    external: true

volumes:
  colbert_model_cache:
    name: besedy_colbert_model_cache
  colbert_torch_cache:
    name: besedy_colbert_torch_cache
