name: besedy-backends

services:
  faster-whisper:
    # Built from this checkout only: never pull this tag from a registry (Compose's
    # default tries a pull before building a missing image).
    image: "${BESEDY_FASTER_WHISPER_IMAGE:-besedy/faster-whisper:local}"
    pull_policy: never
    build:
      context: ..
      dockerfile: backends/faster-whisper/Dockerfile
    init: true
    gpus: all
  nemo:
    image: "${BESEDY_NEMO_IMAGE:-besedy/nemo:local}"
    pull_policy: never
    build:
      context: ..
      dockerfile: backends/nemo/Dockerfile
    init: true
    gpus: all
  qwen3-asr:
    image: "${BESEDY_QWEN3_ASR_IMAGE:-besedy/qwen3-asr:local}"
    pull_policy: never
    build:
      context: ..
      dockerfile: backends/qwen3-asr/Dockerfile
    init: true
    gpus: all
  whisperx:
    image: "${BESEDY_WHISPERX_IMAGE:-besedy/whisperx:local}"
    pull_policy: never
    build:
      context: ..
      dockerfile: backends/whisperx/Dockerfile
    init: true
    gpus: all
  pyannote:
    image: "${BESEDY_PYANNOTE_IMAGE:-besedy/pyannote:local}"
    pull_policy: never
    build:
      context: ..
      dockerfile: backends/pyannote/Dockerfile
    init: true
    gpus: all

networks:
  default:
    enable_ipv6: false
    driver_opts:
      # The host egress policy covers every br-bsdy* bridge
      # (docs/web/egress-isolation.md).
      com.docker.network.bridge.name: br-bsdy-bknd
