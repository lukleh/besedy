# Development overlay - mounts source for hot reloading
# Usage: ../scripts/run_web_compose.sh development up -d

services:
  web:
    # Force webpack in the Docker dev container. Turbopack currently externalizes
    # the Prisma 7 runtime into a hashed package name that does not resolve here.
    command: ["npm", "run", "dev", "--", "--webpack", "--hostname", "0.0.0.0"]
    # Run as the invoking host user (supplied by scripts/run_web_compose.sh) so
    # files the dev server writes into the bind-mounted checkout, such as the
    # generated Prisma client, next-env.d.ts, and new migrations, stay owned by
    # that user instead of root.
    user: "${BESEDY_HOST_UID:-1000}:${BESEDY_HOST_GID:-1000}"
    environment:
      # An arbitrary UID has no home directory; npm needs a writable one.
      HOME: /tmp
      NEXT_DIST_DIR: .cache-next
      DEV_EXTRA_ORIGINS: ${DEV_EXTRA_ORIGINS:-}
    volumes:
      # Mount source code for hot reloading
      - .:/app
      # Preserve container's node_modules (don't overlay with host)
      - /app/node_modules
      # Keep the Next.js build cache outside the repo checkout while preserving
      # an in-app realpath so Node can still resolve /app/node_modules.
      - ${WEB_NEXT_DIR:-${BESEDY_CACHE_HOME:-${HOME}/.cache/lukleh/besedy}/web/.next}:/app/.cache-next
