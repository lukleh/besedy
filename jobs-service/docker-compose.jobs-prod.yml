name: besedy-jobs-prod

x-jobs-build: &jobs-build
  context: ..
  dockerfile: jobs-service/Dockerfile
  args:
    JOBS_UID: ${JOBS_CONTAINER_UID:-1000}
    JOBS_GID: ${JOBS_CONTAINER_GID:-1000}
    REQUIRE_PROVENANCE: "true"
    GIT_COMMIT: ${GIT_COMMIT:-unknown}
    BUILD_TIME: ${BUILD_TIME:-unknown}

x-jobs-hardening: &jobs-hardening
  user: "${JOBS_CONTAINER_UID:-1000}:${JOBS_CONTAINER_GID:-1000}"
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=${JOBS_TMPFS_SIZE:-1g},mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

services:
  jobs-api:
    <<: *jobs-hardening
    container_name: besedy-prod-jobs-api
    # Built from this checkout only: never pull this tag from a registry (Compose's
    # default tries a pull before building a missing image).
    image: ${BESEDY_JOBS_IMAGE:-besedy-jobs:prod}
    pull_policy: never
    build: *jobs-build
    command:
      - python
      - -m
      - besedy.lib.prefect_jobs.server
      - --host
      - 0.0.0.0
      - --port
      - "${JOBS_SERVICE_PORT:-8390}"
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://besedy-prefect-server:4200/api}
      PREFECT_UI_URL: ${PREFECT_UI_URL:-http://localhost:4200}
      JOBS_SERVICE_HOST: 0.0.0.0
      JOBS_SERVICE_PORT: ${JOBS_SERVICE_PORT:-8390}
      PREFECT_INGEST_WORK_POOL: ${PREFECT_INGEST_WORK_POOL:-besedy-ingest-prod}
      PREFECT_INGEST_DEPLOYMENT_NAME: ${PREFECT_INGEST_DEPLOYMENT_NAME:-ingest-prod}
      PREFECT_INGEST_FULL_DEPLOYMENT_NAME: ${PREFECT_INGEST_FULL_DEPLOYMENT_NAME:-ingest_recording_flow/ingest-prod}
      PREFECT_INGEST_CONCURRENCY_LIMIT: ${PREFECT_INGEST_CONCURRENCY_LIMIT:-1}
      PREFECT_INGEST_REMOVE_DEPLOYMENT_NAME: ${PREFECT_INGEST_REMOVE_DEPLOYMENT_NAME:-ingest-remove-prod}
      PREFECT_INGEST_REMOVE_FULL_DEPLOYMENT_NAME: ${PREFECT_INGEST_REMOVE_FULL_DEPLOYMENT_NAME:-remove_recording_flow/ingest-remove-prod}
      PREFECT_CORRECTION_INDEX_DEPLOYMENT_NAME: ${PREFECT_CORRECTION_INDEX_DEPLOYMENT_NAME:-correction-index-prod}
      PREFECT_CORRECTION_INDEX_FULL_DEPLOYMENT_NAME: ${PREFECT_CORRECTION_INDEX_FULL_DEPLOYMENT_NAME:-sync_correction_index_flow/correction-index-prod}
      BESEDY_JOB_SERVICE_SECRET: ${BESEDY_JOB_SERVICE_SECRET:-}
    ports:
      - "${JOBS_SERVICE_HOST_BIND:-127.0.0.1}:${JOBS_SERVICE_HOST_PORT:-8391}:${JOBS_SERVICE_PORT:-8390}"
    networks:
      - default
      - besedy_internal
      - besedy_prefect
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:${JOBS_SERVICE_PORT:-8390}/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    enable_ipv6: false
    driver_opts:
      # The host egress policy covers every br-bsdy* bridge
      # (docs/web/egress-isolation.md).
      com.docker.network.bridge.name: br-bsdy-jprod
  besedy_internal:
    name: ${BESEDY_INTERNAL_NETWORK:-besedy-internal}
    external: true
  besedy_prefect:
    name: ${BESEDY_PREFECT_NETWORK:-besedy-prefect}
    external: true
