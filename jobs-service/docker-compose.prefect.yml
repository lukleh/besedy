name: besedy-prefect

# Derived from the same PREFECT_POSTGRES_* values prefect-postgres starts with,
# so one password change cannot leave the server authenticating with another.
x-prefect-database-url: &prefect-database-url
  ${PREFECT_SERVER_DATABASE_CONNECTION_URL:-postgresql+asyncpg://${PREFECT_POSTGRES_USER:-prefect}:${PREFECT_POSTGRES_PASSWORD:-prefect}@prefect-postgres:5432/${PREFECT_POSTGRES_DB:-prefect}}

# The server version lives here and must match the prefect== pin in
# pyproject.toml. Set PREFECT_IMAGE in the host env file only to pin a
# different version on purpose; a copied value goes stale at the next bump.
x-prefect-image: &prefect-image
  ${PREFECT_IMAGE:-prefecthq/prefect:3.8.7-python3.13}

services:
  prefect-postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    container_name: besedy-prefect-postgres
    environment:
      POSTGRES_USER: ${PREFECT_POSTGRES_USER:-prefect}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD:-prefect}
      POSTGRES_DB: ${PREFECT_POSTGRES_DB:-prefect}
    ports:
      - "${PREFECT_DB_HOST_BIND:-127.0.0.1}:${PREFECT_DB_PORT:-5435}:5432"
    volumes:
      - prefect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${PREFECT_POSTGRES_USER:-prefect} -d ${PREFECT_POSTGRES_DB:-prefect}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prefect
    restart: unless-stopped

  prefect-db-upgrade:
    image: *prefect-image
    container_name: besedy-prefect-db-upgrade
    depends_on:
      prefect-postgres:
        condition: service_healthy
    command:
      - prefect
      - server
      - database
      - upgrade
      - --yes
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: *prefect-database-url
    networks:
      - prefect

  prefect-server:
    image: *prefect-image
    container_name: besedy-prefect-server
    depends_on:
      prefect-db-upgrade:
        condition: service_completed_successfully
    command:
      - prefect
      - server
      - start
      - --host
      - 0.0.0.0
      - --port
      - "4200"
      - --no-services
    environment:
      PREFECT_SERVER_DATABASE_CONNECTION_URL: *prefect-database-url
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_API_PORT: 4200
      PREFECT_UI_API_URL: ${PREFECT_UI_API_URL:-http://localhost:4200/api}
    ports:
      - "${PREFECT_HOST_BIND:-127.0.0.1}:${PREFECT_PORT:-4200}:4200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:4200/api/health', timeout=2).read().decode().strip() == 'true' else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prefect
    restart: unless-stopped

  prefect-services:
    image: *prefect-image
    container_name: besedy-prefect-services
    depends_on:
      prefect-db-upgrade:
        condition: service_completed_successfully
      prefect-server:
        condition: service_healthy
    command:
      - prefect
      - server
      - services
      - start
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_DATABASE_CONNECTION_URL: *prefect-database-url
    networks:
      - prefect
    restart: unless-stopped

volumes:
  prefect_postgres_data:
    name: ${BESEDY_PREFECT_POSTGRES_VOLUME:-besedy_prefect_postgres}
    external: true

networks:
  prefect:
    name: ${BESEDY_PREFECT_NETWORK:-besedy-prefect}
    external: true
