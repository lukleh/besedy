name: besedy-jobs-dev

services:
  jobs-api:
    container_name: besedy-dev-jobs-api
    build:
      context: ..
      dockerfile: jobs-service/Dockerfile
    working_dir: /workspace/besedy
    command:
      - python
      - -m
      - besedy.lib.prefect_jobs.server
      - --host
      - 0.0.0.0
      - --port
      - "${JOBS_SERVICE_PORT:-8390}"
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://besedy-prefect-server:4200/api}
      PREFECT_UI_URL: ${PREFECT_UI_URL:-http://localhost:4200}
      JOBS_SERVICE_HOST: 0.0.0.0
      JOBS_SERVICE_PORT: ${JOBS_SERVICE_PORT:-8390}
      PREFECT_INGEST_WORK_POOL: ${PREFECT_INGEST_WORK_POOL:-besedy-ingest-dev}
      PREFECT_INGEST_DEPLOYMENT_NAME: ${PREFECT_INGEST_DEPLOYMENT_NAME:-ingest-dev}
      PREFECT_INGEST_FULL_DEPLOYMENT_NAME: ${PREFECT_INGEST_FULL_DEPLOYMENT_NAME:-ingest_recording_flow/ingest-dev}
      PREFECT_INGEST_CONCURRENCY_LIMIT: ${PREFECT_INGEST_CONCURRENCY_LIMIT:-1}
      PREFECT_INGEST_REMOVE_DEPLOYMENT_NAME: ${PREFECT_INGEST_REMOVE_DEPLOYMENT_NAME:-ingest-remove-dev}
      PREFECT_INGEST_REMOVE_FULL_DEPLOYMENT_NAME: ${PREFECT_INGEST_REMOVE_FULL_DEPLOYMENT_NAME:-remove_recording_flow/ingest-remove-dev}
      PREFECT_CORRECTION_INDEX_DEPLOYMENT_NAME: ${PREFECT_CORRECTION_INDEX_DEPLOYMENT_NAME:-correction-index-dev}
      PREFECT_CORRECTION_INDEX_FULL_DEPLOYMENT_NAME: ${PREFECT_CORRECTION_INDEX_FULL_DEPLOYMENT_NAME:-sync_correction_index_flow/correction-index-dev}
      BESEDY_ARCHIVE_ID: ${BESEDY_ARCHIVE_ID:-}
      BESEDY_JOB_SERVICE_SECRET: ${BESEDY_JOB_SERVICE_SECRET:-}
    volumes:
      - ..:/workspace/besedy:rw
    ports:
      - "${JOBS_SERVICE_HOST_BIND:-127.0.0.1}:${JOBS_SERVICE_HOST_PORT:-8390}:${JOBS_SERVICE_PORT:-8390}"
    networks:
      default: {}
      besedy_prefect: {}
      besedy_internal:
        aliases:
          - besedy-jobs-api
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; import sys; sys.exit(0 if urlopen('http://127.0.0.1:${JOBS_SERVICE_PORT:-8390}/health', timeout=2).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    enable_ipv6: false
    driver_opts:
      # The host egress policy covers every br-bsdy* bridge
      # (docs/web/egress-isolation.md).
      com.docker.network.bridge.name: br-bsdy-jdev
  besedy_internal:
    name: ${BESEDY_INTERNAL_NETWORK:-besedy-internal}
    external: true
  besedy_prefect:
    name: ${BESEDY_PREFECT_NETWORK:-besedy-prefect}
    external: true
