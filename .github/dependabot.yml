version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; local composite actions pin their own
    # action SHAs and must be listed separately.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # Disable routine version-update PRs. Dependabot security updates use a
    # separate limit and remain enabled through the repository settings.
    open-pull-requests-limit: 0
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
