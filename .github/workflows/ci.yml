name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

# Read-only token; no job needs write access.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint + types + extras-free tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --locked
      - run: just ruff
      - run: just ty
      # The faster-whisper and pyannote backend images run this checkout under
      # Python 3.11, while the package declares >=3.12 and ruff targets py313,
      # so 3.12+ syntax could otherwise reach them unnoticed. Syntax only:
      # nothing is imported. The cache prefix keeps the checkout clean.
      - name: Check the package parses under Python 3.11
        run: uv run --no-project --python 3.11 python -X pycache_prefix=/tmp/py311-pyc -m compileall -q besedy
      # Run every test that does not declare a heavyweight optional runtime or
      # external integration requirement. Marker selection is intentional: a
      # file allowlist would silently miss newly added unit tests. Pytest imports
      # modules before marker filtering, so optional modules must use importorskip
      # before importing packages supplied by an extra.
      - run: >-
          uv run pytest
          -m "not integration and not external and not gpu and not slow and not e2e and not optional_dependency"
          -q
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --quiet --all-extras --no-hashes --no-emit-project --output-file /tmp/requirements.txt
          # DSPy uses DiskCache only in a worker-owned cache. Production sets
          # DSPY_CACHEDIR on an ephemeral, non-root /tmp filesystem, so an
          # attacker able to replace its pickle files already controls the
          # worker UID. Remove this exception when DiskCache publishes a fix.
          uvx pip-audit==2.10.1 \
            --no-deps \
            --disable-pip \
            --ignore-vuln PYSEC-2026-2447 \
            -r /tmp/requirements.txt

  compose-render:
    name: Compose render (every stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Renders web (dev/test/prod through run_web_compose.sh), jobs, Prefect,
      # RAG and backends from their example env files; nothing is built.
      - run: bash scripts/check_compose_renders.sh

  python-jobs:
    name: Python jobs integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv sync --locked --extra jobs
      - run: >-
          uv run pytest
          tests/test_prefect_jobs.py
          tests/test_prefect_jobs_maintenance.py
          tests/test_jobs_production_hardening.py
          tests/test_rlm_integration.py
          -q

  web-typecheck:
    name: Web type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      # pretype-check runs prisma generate and next typegen.
      - run: npm run type-check

  web-lint:
    name: Web lint + dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Prisma applies pending migrations in name order, so a migration named
      # earlier than one production already applied would run in a different
      # order on a fresh database, and a renamed one would run again. It needs
      # no Node, so it runs first and an audit or lint failure cannot hide it.
      - name: Check new migration names
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          bash ../scripts/check_migration_names.sh FETCH_HEAD
      - uses: ./.github/actions/setup-web
      - run: npm run audit:dependencies
      - run: npx prisma generate
      - run: npm run lint

  web-unit:
    name: Web unit (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The shard total comes from strategy.job-total, so editing this list
        # is enough to change the split without dropping any test files.
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - run: npm run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/src/**', 'web/public/**', 'web/messages/**', 'web/prisma/**', 'web/package.json', 'web/next.config.ts', 'web/tsconfig.json', 'web/postcss.config.mjs', 'web/prisma.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('web/package-lock.json') }}-
      - name: Build production bundle
        run: |
          AUTH_SECRET="$(openssl rand -hex 32)"
          export AUTH_SECRET
          npm run build
        env:
          # Build-time placeholders only; production injects real values.
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          BETTER_AUTH_URL: http://localhost:3000

  # The main ruleset requires this check name and no other web check, so it
  # stays and gates every web job, including the build and the correction
  # integration run. It passes only when all of them succeeded, and names
  # each one that did not. It runs even when the run was cancelled: GitHub
  # counts a skipped required check as passing, so skipping here would let a
  # cancelled run's PR merge without the web checks.
  web:
    name: Web type-check + lint + unit
    if: always()
    needs: [web-typecheck, web-lint, web-unit, web-build, correction-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every web job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -r 'to_entries[] | select(.value.result != "success")
            | "::error title=\(.key) \(.value.result)::The \(.key) job finished as \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  correction-integration:
    name: Migrations + transcript correction integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        # pgvector, because the migration history includes the RAG tables.
        # Same image the compose stack uses, so CI and local agree.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: besedy_correction_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-web
      - run: npx prisma generate
      # The same roles production uses: migrations run as besedy_migrator and
      # the app as besedy_app, so a migration or query that needs more
      # privileges than production grants fails here instead of at deploy.
      - name: Create the migrator and app roles
        run: bash init-db-users.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: besedy_correction_ci
          MIGRATE_PASSWORD: migrator
          APP_PASSWORD: app
      - name: Apply migrations as besedy_migrator
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://besedy_migrator:migrator@localhost:5432/besedy_correction_ci
      # The grants `just prod-migrate` applies after migrating; keep in step.
      - name: Apply the production app grants
        run: >-
          psql -v ON_ERROR_STOP=1
          -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO besedy_app;"
          -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO besedy_app;"
          -c "REVOKE DELETE ON TABLE public.audit_log FROM besedy_app;"
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: besedy_correction_ci
      # Fails when a schema.prisma edit has no migration, or a migration
      # disagrees with the schema. It compares what Prisma models (tables,
      # columns, indexes, foreign keys); objects that exist only in migration
      # SQL, such as triggers, the view and CHECK constraints, are outside it.
      # Exit code 2 means the migrated database and the schema differ.
      - name: Check migrations match schema.prisma
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: postgresql://besedy_migrator:migrator@localhost:5432/besedy_correction_ci
      # The unit suite mocks the database and the filesystem away, which is
      # exactly where correction's invariants live: the partial unique indexes,
      # the workspace lock, the frozen source on disk, the rendered artifacts
      # and the pointer file the Python indexer reads. This is the job that
      # exercises them.
      - name: Correction smoke check as besedy_app
        run: npm run test:correction-smoke
        env:
          DATABASE_URL: postgresql://besedy_app:app@localhost:5432/besedy_correction_ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan checked-out source with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
        with:
          args: dir --redact --verbose /github/workspace
