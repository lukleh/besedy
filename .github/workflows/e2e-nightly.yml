name: Nightly E2E

# The browser end-to-end suite and the MCP smoke test need the whole web stack
# (production build, Postgres, mock OAuth), so they run nightly instead of on
# every PR. The pull_request trigger only fires for changes to this file, so a
# change to the workflow is tried on its own PR before it lands.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/e2e-nightly.yml

# Read-only token; no job needs write access.
permissions:
  contents: read

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Web E2E smoke and MCP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # The template has throwaway secrets only and points every data path at
      # web/tests/e2e/fixtures, so the runner needs nothing from a real host.
      BESEDY_WEB_ENV_TEST: web/.env.test.example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - uses: ./.github/actions/setup-web
      - name: Keep test output inside the runner's temp dir
        run: echo "BESEDY_STATE_HOME=$RUNNER_TEMP/besedy-state" >> "$GITHUB_ENV"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate the Prisma client
        working-directory: web
        run: npx prisma generate
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      # Before the stack starts, so the web container sees its catalog data.
      - name: Generate test fixtures
        working-directory: web
        run: npm run test:e2e:generate
      - name: Start the test stack
        run: just test-up
      - name: Playwright smoke (@smoke, Desktop Chrome)
        working-directory: web
        run: npm run test:e2e:smoke
      - name: Test stack logs
        if: failure()
        working-directory: web
        run: bash ../scripts/run_web_compose.sh test logs --no-color --tail 300
      - name: Stop the test stack
        if: ${{ !cancelled() }}
        run: just test-down
      # Runs its own stack instance with a ColBERT mock and tears it down.
      - name: MCP smoke
        if: ${{ !cancelled() }}
        run: just mcp-smoke
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ${{ runner.temp }}/besedy-state/web/test-output
          if-no-files-found: warn
          retention-days: 14
