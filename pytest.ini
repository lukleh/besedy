[pytest]
addopts = --ignore=worktrees
markers =
    integration: marks tests as integration tests requiring external tools (ffmpeg, etc.)
    external: marks tests requiring data or source trees outside this checkout
    gpu: marks tests requiring GPU (CUDA)
    slow: marks tests that take > 30 seconds
    e2e: marks end-to-end pipeline tests
    optional_dependency: marks tests requiring an optional project dependency extra
