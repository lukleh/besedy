[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["besedy"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "besedy"
version = "0.1.0"
description = "Speech-to-text transcript extraction toolkit for Czech language recordings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "rich>=15.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
jobs = [
    "prefect==3.8.0",
    "rlmbenchy @ git+https://github.com/lukleh/rlmbenchy.git",
]
ml = [
    # Optional host-side helpers for RAG, speaker tooling, and workflow scripts.
    # Core catalog/analyze commands stay lightweight; Docker backend images own
    # their runtime-specific dependency stacks.
    "huggingface-hub>=1.24.0",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pyyaml>=6.0.2",
    "scipy>=1.18.0",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "torch>=2.9.0",
    "torchaudio>=2.9.0",
    "torchcodec>=0.15.0",
    "transformers>=5.14.1",
]

[dependency-groups]
dev = [
    "numpy>=2.5.1",
    "pytest>=9.0.2",
    "pyyaml>=6.0.2",
    "ruff>=0.16.0",
    "tqdm>=4.69.1",
    "ty>=0.0.63",
    "vulture>=2.16",
]

# Stable PyTorch with CUDA 13.0 on Linux x86_64
[tool.uv]
prerelease = "if-necessary-or-explicit"
index-strategy = "unsafe-best-match"
constraint-dependencies = [
    # 2.11.2 was yanked for accidentally merged unreleased features.
    "pydantic-extra-types!=2.11.2",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
torchcodec = { index = "pytorch-cu130" }
triton = { index = "pytorch-cu130" }

[tool.ty.rules]
"unresolved-import" = "ignore"

[tool.vulture]
paths = ["besedy", "tests"]
exclude = [".venv", "venv", "build", "dist", "node_modules", "__pycache__", "site-packages"]
ignore_decorators = ["@*.tool*", "@pytest.fixture", "@field_validator", "@model_validator", "@validator"]
ignore_names = ["model_config", "pytest_*"]
min_confidence = 80

[tool.ty.src]
include = [
    "besedy",
]
